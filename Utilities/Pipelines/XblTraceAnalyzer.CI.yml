# CI trigger. Fires on merges to specific branches.
# Ref: https://docs.microsoft.com/en-us/azure/devops/pipelines/repos/azure-repos-git#ci-triggers
# A pipeline with no CI trigger
trigger: none

# Name builds with the definition name, date, and build-count-for-that-day. For
# example, "BuildDefName_20210214.1".
# Refs:
# - https://docs.microsoft.com/en-us/azure/devops/pipelines/process/run-number
# - https://docs.microsoft.com/en-us/azure/devops/pipelines/build/variables
name: $(Build.DefinitionName)_$(date:yyMM).$(date:dd)$(rev:rrr)

resources:
  repositories:
  - repository: self
    type: git
    ref: refs/heads/main
  - repository: templates_onebranch
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main

jobs:

  ####################
  # Visual Studio 2022
  ####################

  # Microsoft-hosted windows-2022 image. Stay on windows-2022: postBuildScript.cmd
  # uses wmic, which is not present on windows-2025.
  - job: Win32Vs22Build
    displayName: XblTraceAnalyzer Win32 VS2022 Build
    pool:
      vmImage: windows-2022
    timeoutInMinutes: 180
    strategy:
      matrix:
        AnyCPU_Debug:
          Platform: Any CPU
          Configuration: Debug
          Prefast: Disable
        AnyCPU_Release:
          Platform: Any CPU
          Configuration: Release
          Prefast: Disable
    steps:
      - template: Tasks/vs2022-build.yml
        parameters:
          platform: $(Platform)
          configuration: $(Configuration)
          prefast: $(Prefast)
